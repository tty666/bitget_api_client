[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitget-api-client"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A Python client for the Bitget API V2"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp",
    "requests",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/bitget-api-client"
"Bug Tracker" = "https://github.com/yourusername/bitget-api-client/issues"
